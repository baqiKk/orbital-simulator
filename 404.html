<!-- The site's "not found" page (2026-11-22). Cloudflare Pages (and GitHub Pages) serve it with the status 404 for every
     address the site does not have; without it Cloudflare would answer the home page with 200. It is served at any
     depth (/tools/deploy/build.js, /a/b/c), so it is self-contained: no relative path to another file of the site (the
     styles inline, the colours copied from the :root tokens of css/style.css, the icon a data: copy of favicon.svg),
     only Google Fonts outside; the way home is the site's address from tools/deploy/site.json (tools/deploy/site-url.js
     writes it). Turkish and English side by side: this page cannot load js/i18n.js (tests/ui.test.js 75). -->

<style>
:root{
  --void:#030507; --bg:#05080b; --panel:rgba(8,12,16,.84); --line:rgba(140,196,212,.15); --line3:rgba(140,196,212,.5);
  --ink:#d9e7eb; --dim:#86a0a8; --faint:#56696f; --accent:#ffb547; --accent-ink:#1b1305; --orbit:#7cc4d8;
  --f-disp:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--orbit) 7%,var(--bg)),var(--bg) 60%,var(--void));color:var(--ink);font:400 15px/1.55 var(--f-body)}
.box{width:min(460px,100%);padding:32px 28px 28px;background:var(--panel);border:1px solid var(--line3);text-align:center}
.mark{display:block;width:72px;height:72px;margin:0 auto 18px}
.code{margin:0;font:500 13px/1 var(--f-mono);letter-spacing:.3em;color:var(--accent)}
h1{margin:10px 0 0;font:600 28px/1.15 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.en-h{margin:6px 0 0;font:500 15px/1.3 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
p.t{margin:16px 0 0;color:var(--dim)}
p.t + p.t{margin-top:4px;color:var(--faint);font-size:13.5px}
.home{display:inline-block;margin-top:24px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);font:600 12.5px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid var(--accent)}
.home:hover,.home:focus-visible{filter:brightness(1.08);outline:2px solid var(--ink);outline-offset:2px}
.home span{color:color-mix(in srgb,var(--accent-ink) 70%,var(--accent))}
@media (max-width:400px){.box{padding:26px 18px 22px}h1{font-size:23px}}
</style>
</head>
