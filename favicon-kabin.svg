<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Cabin icon (original), in the site icon's flat style with hard shadows (no gradients, no glare): the same rounded
     tile, a brass porthole with a dark brass shadow offset to the lower right, through its glass the site icon's planet
     and orbit, and in front the ears of the cabin's white cat seen from behind, parted from the brass by a tile coloured
     band. Colours: the site icon's (tile #0b1116 icon-bg, planet #7cc4d8 and #4c8da1 icon-shade, orbit #ffb547, spark
     #ffffff, star #d9e7eb) and css/style.css tokens: void #030507 (glass), cab-brass #c8954f, cab-brass-lo #6e4a22, cab-cat #f6f2ea,
     cab-cat-mid #ddd4c7 (the cat's shaded half, as the planet's), cab-ear #e3a19c. At tab size
     (24 px and below) the rivets and the star go, the frame and the orbit grow bolder. -->
<style>@media (max-width:24px){.fine{display:none}.frame{stroke-width:7}.r{stroke-width:5}.g{stroke-width:9}}</style>
<defs><clipPath id="t"><rect width="64" height="64" rx="9"/></clipPath><clipPath id="w"><circle cx="32" cy="26" r="19"/></clipPath>
<path id="cat" d="M12 72C11 60 15 54 20.5 51.5L18.5 40.5L27.5 47.6Q32 46.2 36.5 47.6L45.5 40.5L43.5 51.5C49 54 53 60 52 72Z"/>
<clipPath id="cl"><use href="#cat"/></clipPath></defs>
<rect width="64" height="64" rx="9" fill="#0b1116"/>
<circle cx="34" cy="28" r="24" fill="#6e4a22"/>
<circle class="frame" cx="32" cy="26" r="21.5" fill="#030507" stroke="#c8954f" stroke-width="5"/>
<g clip-path="url(#w)"><g transform="translate(32 26) scale(.64) translate(-32 -32)">
<g transform="rotate(-24 32 32)"><path class="r" d="M5 32 A27 7.5 0 0 1 59 32" fill="none" stroke="#ffb547" stroke-width="3.4"/></g>
<circle cx="32" cy="32" r="12.5" fill="#7cc4d8"/>
<path d="M32 19.5 A12.5 12.5 0 0 0 32 44.5 L32 19.5Z" fill="#4c8da1"/>
<g transform="rotate(-24 32 32)">
<path class="g" d="M59 32 A27 7.5 0 0 1 5 32" fill="none" stroke="#030507" stroke-width="6.6"/>
<path class="r" d="M59 32 A27 7.5 0 0 1 5 32" fill="none" stroke="#ffb547" stroke-width="3.4"/>
<path d="M13.50 33.80 Q14.05 37.85 18.10 38.40 Q14.05 38.95 13.50 43.00 Q12.95 38.95 8.90 38.40 Q12.95 37.85 13.50 33.80 Z" fill="#ffffff"/></g>
<path class="fine" d="M51.00 12.00 Q51.36 14.64 54.00 15.00 Q51.36 15.36 51.00 18.00 Q50.64 15.36 48.00 15.00 Q50.64 14.64 51.00 12.00 Z" fill="#d9e7eb"/>
</g></g>
<g class="fine" fill="#6e4a22"><circle cx="47.2" cy="10.8" r="1.2"/><circle cx="16.8" cy="10.8" r="1.2"/><circle cx="10.5" cy="26" r="1.2"/><circle cx="53.5" cy="26" r="1.2"/></g>
<g clip-path="url(#t)">
<use href="#cat" fill="none" stroke="#0b1116" stroke-width="5" stroke-linejoin="round"/>
<use href="#cat" fill="#f6f2ea"/>
<rect x="0" y="0" width="32" height="72" fill="#ddd4c7" clip-path="url(#cl)"/>
<path d="M21 44.3L25.6 48.3L21.7 50.2Z" fill="#e3a19c" stroke="#e3a19c" stroke-width="1" stroke-linejoin="round"/>
<path d="M43 44.3L38.4 48.3L42.3 50.2Z" fill="#e3a19c" stroke="#e3a19c" stroke-width="1" stroke-linejoin="round"/>
</g>
</svg>
