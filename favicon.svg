<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Site icon (original): a ringed planet on a dark disc, a dashed transfer orbit around it, a craft on the orbit.
     Colours are css/style.css tokens: bg #05080b, cyan #9fd6e4, orbit #7cc4d8, ink #d9e7eb, accent #ffb547.
     Small sizes: longer dashes up to 40 px; at tab size (≤ 24 px) the dashes, the ring's far side and the disc's edge
     give way to bolder strokes. -->
<style>
.orb{stroke-dasharray:6.2 4.4}
@media (max-width:40px){.orb{stroke-dasharray:10 6.5;stroke-width:3.6}.edge{stroke-opacity:.45}}
@media (max-width:24px){.orb{stroke-dasharray:none;stroke-width:4.2}.ring{stroke-width:3.6}.far,.edge{display:none}.craft{r:6.6}.core{r:2.6}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd6e4"/><stop offset="1" stop-color="#7cc4d8"/></linearGradient></defs>
<circle cx="32" cy="32" r="32" fill="#05080b"/>
<circle class="edge" cx="32" cy="32" r="31" fill="none" stroke="#9fd6e4" stroke-opacity=".3" stroke-width="2"/>
<ellipse class="orb" cx="35" cy="29.5" rx="25" ry="14.5" transform="rotate(-24 35 29.5)" fill="none" stroke="#ffb547" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(29 35) rotate(-18)">
  <path class="ring far" d="M-17 0A17 5.2 0 0 1 17 0" fill="none" stroke="#d9e7eb" stroke-width="2.6"/>
  <circle r="10" fill="url(#g)"/>
  <path class="ring" d="M-17 0A17 5.2 0 0 0 17 0" fill="none" stroke="#d9e7eb" stroke-width="2.6" stroke-linecap="round"/>
</g>
<circle class="craft" cx="47" cy="13" r="5.2" fill="#ffb547"/>
<circle class="core" cx="47" cy="13" r="2" fill="#d9e7eb"/>
</svg>
