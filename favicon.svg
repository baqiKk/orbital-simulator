<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Site icon (original, flat): a dark disc, the Earth and the Moon, the simulator's own Earth-Moon free return as an
     amber S wrapping both, and the craft on it. Colours are css/style.css tokens: bg #05080b, accent #ffb547 (the path),
     orbit #7cc4d8 (the Earth), dim #86a0a8 (the Moon), ink #d9e7eb (the craft). At tab size (24 px and below) the path
     grows bolder and the craft goes: the disc, the S and two dots remain. -->
<style>@media (max-width:24px){.p{stroke-width:5}.c{display:none}}</style>
<circle cx="32" cy="32" r="32" fill="#05080b"/>
<path class="p" d="M29 13C39 5 55 9 54 21C53 32 41 33 32 33C23 33 9 37 11.5 47C14 57 29 58 34 50" fill="none" stroke="#ffb547" stroke-width="3.6" stroke-linecap="round"/>
<circle cx="23" cy="44" r="8.5" fill="#7cc4d8"/>
<circle cx="42" cy="21" r="5.5" fill="#86a0a8"/>
<circle class="c" cx="31.5" cy="33" r="3" fill="#d9e7eb"/>
</svg>
