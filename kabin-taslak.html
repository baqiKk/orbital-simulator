<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kabin · taslak</title>
<meta name="description" data-i18n-content="kab.description" content="Yörünge simülatörünün kabin modu için görsel tasarım taslağı: masa ve cam görünümü.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Playpen+Sans:wght@400&display=swap">
<link rel="stylesheet" href="css/style.css">
<!-- Phase 9 design draft, second direction (stand-alone): a warm, lived-in study facing a large window, seen from the
     desk chair; no person in the scene. Only layout, light and colour: the clock, sound and notebook do nothing yet.
     All drawings are original SVG written for this page. Outside the glass: the site's own sky and planet images
     (globe.js). Poster photo: NASA AS08-14-2383 (public domain, img/cabin/, see js/bodies.js CABIN_SRC); handwriting:
     Playpen Sans (SIL OFL 1.1, Google Fonts). -->
<style>
  :root{
    /* cabin palette (approved --cab-* tokens; outside stays --void, the lamp is --accent, screens and window light --cyan) */
    --cab-wall:#2a2422; --cab-wall-hi:#40352e; --cab-wall-lo:#161210; --cab-seam:#0d0a09;
    --cab-metal:#4b433d; --cab-metal-hi:#8a7b6c; --cab-metal-lo:#221d1a;
    --cab-brass:#c8954f; --cab-brass-lo:#6e4a22;
    --cab-wood:#7c4a2a; --cab-wood-hi:#b0703f; --cab-wood-lo:#3e2310; --cab-wood-dk:#1f1108;
    --cab-rust:#a5452c; --cab-rust-hi:#d0674a; --cab-rust-lo:#5e2416;
    --cab-mustard:#d49a3a; --cab-cream:#eadbbb; --cab-cream-lo:#b9a586; --cab-paper:#efe4cc; --cab-light:#fff1d6;
    --cab-kraft:#a97c4e; --cab-kraft-lo:#6d4a28;
    --cab-leaf:#3f6e3c; --cab-leaf-hi:#7fae62; --cab-pot:#b5653c; --cab-pot-lo:#7a3f22;
    --cab-tea:#c4511d; --cab-tea-lo:#6e1f08;
    --cab-cat:#f3eee6; --cab-cat-lo:#b8ad9f; --cab-eye-b:#4fa6e8;
    --cab-water:#174c56; --cab-water-hi:#3f8f98;
    --cab-shadow:#0a0604; --cab-screen-bg:#06141a;
    --cab-lamp:var(--accent); --cab-screen:var(--cyan);
  }
  html,body{background:var(--cab-wall-lo)}
  .cabin{position:fixed;inset:0;overflow:hidden;overflow:clip;background:var(--void)} /* clip: focusing an object must not scroll the room */
  #spaceWrap{position:absolute;inset:0}
  #drift{position:absolute;inset:0;animation:drift 600s ease-in-out infinite alternate}
  #space{position:absolute;display:block}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  .layer{position:absolute;inset:0;pointer-events:none}
  .bg svg{display:block}
  .obj{position:absolute;display:block;padding:0;margin:0;border:0;background:none;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent;color:inherit}
  .obj svg{display:block;width:100%;height:auto;overflow:visible;transition:filter .2s}
  .obj.deco{pointer-events:none;cursor:default}
  .obj:not(.deco):hover svg,.obj:focus-visible svg{filter:drop-shadow(0 0 9px color-mix(in srgb,var(--cab-lamp) 60%,transparent))}
  .obj:focus-visible{outline:none}
  #o-glass{cursor:zoom-in}
  #o-glass:hover{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--cab-screen) 35%,transparent)}
  #o-glass:focus-visible{box-shadow:inset 0 0 0 3px var(--cab-lamp)}
  #lLight{mix-blend-mode:screen}
  .warm{animation:flick 13s infinite;transition:opacity .6s}
  .shade-off{opacity:0;transition:opacity .6s}
  .lamp-off .warm{opacity:0;animation:none}
  .lamp-off .shade-off{opacity:.55}
  .bulb{transition:opacity .5s}
  .lamp-off .bulb{opacity:.12}
  #vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 76% at 50% 46%,transparent 55%,color-mix(in srgb,var(--cab-shadow) 70%,transparent) 100%)}

  .khud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center}
  .khud.top{top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px))}
  .khud.bot{left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));justify-content:center;flex-wrap:wrap;padding:0 16px;pointer-events:none}
  .khud.bot>*{pointer-events:auto}
  .khud .ghost{text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:8px 11px}
  .badge{font:600 10px/1 var(--f-disp);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--panel);border:1px solid var(--accent-soft);padding:7px 8px;cursor:help}
  #go{min-width:140px;padding:10px 16px}
  .khud .seg button{padding:9px 11px}
  #tip{position:fixed;z-index:6;pointer-events:none;transform:translate(-50%,-100%);background:var(--panel-lo);border:1px solid var(--line2);padding:6px 9px;font:500 11px/1.2 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);white-space:nowrap}

  /* the poster: photo or original */
  #o-poster .pv-own{display:none}
  #o-poster.own .pv-own{display:inline}
  #o-poster.own .pv-photo{display:none}
  .hand{font-family:"Playpen Sans",cursive}
  .disp{font-family:var(--f-disp);font-weight:600}

  /* the cat: sitting (back to us) or walking (side view; facing left shows the amber eye, right the blue one) */
  #o-cat .walkG{display:none}
  #o-cat[data-pose=walk] .sitG,#o-cat[data-pose=paw] .sitG{display:none}
  #o-cat[data-pose=walk] .walkG,#o-cat[data-pose=paw] .walkG{display:inline}
  #o-cat[data-face=r] .walkG{transform:translate(200px,0) scaleX(-1)}
  #o-cat .eye{fill:var(--cab-mustard)}
  #o-cat[data-face=r] .eye{fill:var(--cab-eye-b)}
  .leg,.pawleg{transform-box:fill-box;transform-origin:50% 0}
  #o-cat[data-pose=walk] .leg.a{animation:stepA .42s ease-in-out infinite alternate}
  #o-cat[data-pose=walk] .leg.b{animation:stepA .42s ease-in-out infinite alternate-reverse}
  #o-cat[data-pose=walk] .walkG .bob{animation:bob .42s ease-in-out infinite alternate}
  #o-cat[data-pose=paw] .pawleg{animation:paw .85s ease-in-out 3}
  .tail{transform-box:fill-box;transform-origin:0 0;animation:tail 4.2s ease-in-out infinite alternate}
  .wtail{transform-box:fill-box;transform-origin:0 100%;animation:wtail 2.4s ease-in-out infinite alternate}
  .earL,.earR{transform-box:fill-box;transform-origin:50% 100%}
  .earR{animation:ear 9s infinite}
  .earL{animation:ear 13s -5s infinite}

  /* small animations: transforms and opacity only */
  .steam{filter:url(#fSteam)}
  .steam path{fill:none;stroke:var(--cab-light);stroke-width:5;stroke-linecap:round;opacity:0;animation:steam 6.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  .steam path:nth-child(2){animation-delay:-2.2s;animation-duration:7.2s}
  .steam path:nth-child(3){animation-delay:-4.4s;animation-duration:5.8s}
  .colon{animation:blink 2s steps(1) infinite}
  .seg7 polygon{fill:var(--cab-lamp);opacity:.08}
  .seg7 polygon.on{opacity:1}
  .scr-glow{animation:breathe 7s ease-in-out infinite alternate}
  .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 9s ease-in-out infinite alternate}
  .weed{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
  .mote{transform-box:fill-box;animation:mote 10s linear infinite}
  .fish{transform-box:fill-box;transform-origin:50% 50%;animation:swim 14s ease-in-out infinite}
  .fish.f2{animation-duration:11s;animation-delay:-4s}
  .fish.f3{animation-duration:17s;animation-delay:-9s}
  .startle .fish{animation-duration:2.4s}
  .bub{transform-box:fill-box;animation:bub 4s linear infinite}
  .led{animation:led 4s infinite}
  .obj.nudge svg{animation:nudge .45s ease-out}
  @keyframes drift{from{transform:translate(-36px,-8px)}to{transform:translate(36px,8px)}}
  @keyframes steam{0%{opacity:0;transform:translateY(10px) scaleY(.85)}30%{opacity:.34}70%{opacity:.16}100%{opacity:0;transform:translate(5px,-24px) scaleY(1.12)}}
  @keyframes blink{0%{opacity:1}50%{opacity:.18}}
  @keyframes flick{0%,57%,60%,84%,86%,100%{opacity:1}58%{opacity:.88}59%{opacity:.97}85%{opacity:.93}}
  @keyframes breathe{from{opacity:.6}to{opacity:1}}
  @keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
  @keyframes mote{0%{transform:translate(0,0);opacity:0}20%{opacity:.75}80%{opacity:.45}100%{transform:translate(22px,-30px);opacity:0}}
  @keyframes swim{0%{transform:translateX(0) scaleX(1)}46%{transform:translateX(-70px) scaleX(1)}50%{transform:translateX(-70px) scaleX(-1)}96%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
  @keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-86px);opacity:0}}
  @keyframes led{0%,88%{opacity:1}90%,100%{opacity:.25}}
  @keyframes nudge{0%,100%{transform:none}30%{transform:translateY(-6px) rotate(-1deg)}60%{transform:rotate(.6deg)}}
  @keyframes tail{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
  @keyframes wtail{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
  @keyframes ear{0%,88%,100%{transform:none}90%{transform:rotate(-14deg)}92%{transform:rotate(5deg)}94%{transform:none}}
  @keyframes stepA{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
  @keyframes paw{0%,100%{transform:rotate(0)}45%{transform:rotate(72deg)}60%{transform:rotate(64deg)}}
  html.paused *{animation-play-state:paused!important}
  /* low-resource mode (saved from the simulator, or ?q=low) and reduced motion: everything holds still, the cat sits */
  html[data-q=low] *{animation:none!important}
  html[data-q=low] .steam path{opacity:.14}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .steam path{opacity:.14}
  }
</style>
</head>
<body>

<!-- shared paint: gradients, patterns, filters, the leaf -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gCushion" cx=".42" cy=".36" r=".78">
      <stop offset="0" style="stop-color:var(--cab-wall-hi)"/><stop offset=".62" style="stop-color:var(--cab-wall)"/><stop offset="1" style="stop-color:var(--cab-wall-lo)"/>
    </radialGradient>
    <pattern id="pQuilt" width="140" height="120" patternUnits="userSpaceOnUse">
      <rect width="140" height="120" style="fill:var(--cab-seam)"/>
      <rect x="3" y="3" width="134" height="114" rx="24" style="fill:url(#gCushion)"/>
      <circle cx="0" cy="0" r="5" style="fill:var(--cab-brass-lo)"/><circle cx="140" cy="0" r="5" style="fill:var(--cab-brass-lo)"/>
      <circle cx="0" cy="120" r="5" style="fill:var(--cab-brass-lo)"/><circle cx="140" cy="120" r="5" style="fill:var(--cab-brass-lo)"/>
    </pattern>
    <pattern id="pKnit" width="26" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <rect width="26" height="30" style="fill:var(--cab-rust)"/>
      <rect y="30" width="26" height="30" style="fill:var(--cab-mustard)"/>
      <rect y="60" width="26" height="30" style="fill:var(--cab-cream)"/>
      <path d="M3 3L13 13L23 3M3 18L13 28L23 18M3 33L13 43L23 33M3 48L13 58L23 48M3 63L13 73L23 63M3 78L13 88L23 78" style="fill:none;stroke:var(--cab-wood-dk);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round" opacity=".3"/>
    </pattern>
    <linearGradient id="gWallShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-shadow);stop-opacity:.65"/><stop offset=".35" style="stop-color:var(--cab-shadow);stop-opacity:.1"/>
      <stop offset=".7" style="stop-color:var(--cab-shadow);stop-opacity:.1"/><stop offset="1" style="stop-color:var(--cab-shadow);stop-opacity:.5"/>
    </linearGradient>
    <linearGradient id="gFrameWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-wood-hi)"/><stop offset=".3" style="stop-color:var(--cab-wood)"/><stop offset="1" style="stop-color:var(--cab-wood-lo)"/>
    </linearGradient>
    <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--cab-light)"/><stop offset=".25" style="stop-color:var(--cab-brass)"/><stop offset="1" style="stop-color:var(--cab-brass-lo)"/>
    </linearGradient>
    <linearGradient id="gCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--cab-brass-lo)"/><stop offset=".3" style="stop-color:var(--cab-rust-hi)"/><stop offset=".45" style="stop-color:var(--cab-brass)"/><stop offset="1" style="stop-color:var(--cab-rust-lo)"/>
    </linearGradient>
    <linearGradient id="gMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-metal-hi)"/><stop offset=".3" style="stop-color:var(--cab-metal)"/><stop offset="1" style="stop-color:var(--cab-metal-lo)"/>
    </linearGradient>
    <linearGradient id="gCeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-seam)"/><stop offset="1" style="stop-color:var(--cab-metal-lo)"/>
    </linearGradient>
    <linearGradient id="gDownShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-shadow);stop-opacity:.6"/><stop offset="1" style="stop-color:var(--cab-shadow);stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="gUpShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-shadow);stop-opacity:0"/><stop offset="1" style="stop-color:var(--cab-shadow);stop-opacity:.55"/>
    </linearGradient>
    <linearGradient id="gWoodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-wood-hi)"/><stop offset="1" style="stop-color:var(--cab-wood)"/>
    </linearGradient>
    <linearGradient id="gWoodFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-wood)"/><stop offset="1" style="stop-color:var(--cab-wood-lo)"/>
    </linearGradient>
    <linearGradient id="gDeskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-wood-lo)"/><stop offset=".4" style="stop-color:var(--cab-wood)"/><stop offset="1" style="stop-color:var(--cab-wood-hi)"/>
    </linearGradient>
    <linearGradient id="gDeskFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-wood-lo)"/><stop offset="1" style="stop-color:var(--cab-wood-dk)"/>
    </linearGradient>
    <linearGradient id="gEnamel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--cab-rust-lo)"/><stop offset=".4" style="stop-color:var(--cab-rust-hi)"/><stop offset="1" style="stop-color:var(--cab-rust-lo)"/>
    </linearGradient>
    <linearGradient id="gShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--cab-rust-hi)"/><stop offset=".5" style="stop-color:var(--cab-rust)"/><stop offset="1" style="stop-color:var(--cab-rust-lo)"/>
    </linearGradient>
    <radialGradient id="gBulb" cx=".5" cy=".45" r=".6">
      <stop offset="0" style="stop-color:var(--cab-light)"/><stop offset=".5" style="stop-color:var(--cab-lamp)"/><stop offset="1" style="stop-color:var(--cab-rust)"/>
    </radialGradient>
    <linearGradient id="gCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-cream)"/><stop offset="1" style="stop-color:var(--cab-cream-lo)"/>
    </linearGradient>
    <linearGradient id="gClockScr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-wood-dk)"/><stop offset="1" style="stop-color:var(--cab-shadow)"/>
    </linearGradient>
    <linearGradient id="gPot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--cab-pot-lo)"/><stop offset=".38" style="stop-color:var(--cab-pot)"/><stop offset="1" style="stop-color:var(--cab-pot-lo)"/>
    </linearGradient>
    <linearGradient id="gTea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-tea)"/><stop offset="1" style="stop-color:var(--cab-tea-lo)"/>
    </linearGradient>
    <linearGradient id="gChair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-wood)"/><stop offset=".3" style="stop-color:var(--cab-wood-lo)"/><stop offset="1" style="stop-color:var(--cab-wood-dk)"/>
    </linearGradient>
    <linearGradient id="gFold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--cab-shadow);stop-opacity:0"/><stop offset=".55" style="stop-color:var(--cab-shadow);stop-opacity:.15"/><stop offset="1" style="stop-color:var(--cab-shadow);stop-opacity:.55"/>
    </linearGradient>
    <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-water-hi);stop-opacity:.85"/><stop offset="1" style="stop-color:var(--cab-water);stop-opacity:.95"/>
    </linearGradient>
    <radialGradient id="gCat" cx=".4" cy=".3" r=".8">
      <stop offset="0" style="stop-color:var(--cab-cat)"/><stop offset=".6" style="stop-color:var(--cab-cat)"/><stop offset="1" style="stop-color:var(--cab-cat-lo)"/>
    </radialGradient>
    <!-- backlight from the window along the cat's top edges, the lamp's warmth on its left side -->
    <linearGradient id="gRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-screen);stop-opacity:.9"/><stop offset=".45" style="stop-color:var(--cab-screen);stop-opacity:.35"/><stop offset=".8" style="stop-color:var(--cab-screen);stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="gWarmL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color:var(--cab-lamp);stop-opacity:.22"/><stop offset=".5" style="stop-color:var(--cab-lamp);stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="gTabEarth" cx=".38" cy=".35" r=".7">
      <stop offset="0" style="stop-color:var(--cab-screen)"/><stop offset="1" style="stop-color:var(--orbit)"/>
    </radialGradient>
    <radialGradient id="gWash">
      <stop offset="0" style="stop-color:var(--cab-lamp);stop-opacity:.2"/><stop offset="1" style="stop-color:var(--cab-lamp);stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="gPool">
      <stop offset="0" style="stop-color:var(--cab-lamp);stop-opacity:.5"/><stop offset=".55" style="stop-color:var(--cab-lamp);stop-opacity:.17"/><stop offset="1" style="stop-color:var(--cab-lamp);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="gCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--cab-lamp);stop-opacity:.2"/><stop offset="1" style="stop-color:var(--cab-lamp);stop-opacity:.04"/>
    </linearGradient>
    <radialGradient id="gHalo">
      <stop offset="0" style="stop-color:var(--cab-light);stop-opacity:.65"/><stop offset=".3" style="stop-color:var(--cab-lamp);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--cab-lamp);stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="gScreenGlow">
      <stop offset="0" style="stop-color:var(--cab-screen);stop-opacity:.18"/><stop offset="1" style="stop-color:var(--cab-screen);stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="gCoolWash">
      <stop offset="0" style="stop-color:var(--cab-screen);stop-opacity:.09"/><stop offset="1" style="stop-color:var(--cab-screen);stop-opacity:0"/>
    </radialGradient>
    <filter id="fBlur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="fBlur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="fBlur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="fSoft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="fSteam" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="fGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

const TRAJ = [-11,-13,7,-22,27,-23,47,-19,67,-14,87,-7,106,2,125,11,147,21,167,32,185,41,205,52,227,63,245,73,265,83,286,93,309,104,333,115,360,126,378,134,406,144,433,153,458,160,484,167,508,172,532,176,555,179,578,182,600,183,622,183,644,183,665,182,685,179,705,177,725,173,751,167,776,160,801,151,824,142,848,131,870,119,892,106,913,92,933,77,952,62,967,48,983,33,997,17,1005,-1,995,-19,981,-35,965,-50,949,-65,932,-78,914,-92,893,-106,871,-119,848,-131,825,-142,802,-152,777,-160,752,-167,726,-174,706,-177,686,-180,666,-182,645,-184,623,-184,602,-184,579,-183,557,-181,533,-177,509,-173,485,-168,460,-162,434,-154,408,-146,380,-136,361,-128,342,-120,323,-112,296,-99,272,-87,250,-76,230,-66,211,-56,188,-44,168,-33,150,-24,130,-14,109,-4,87,5,67,13,46,19,26,22,5,21,-11,12];
function trajPath(E, M) {
  const D = [M[0] - E[0], M[1] - E[1]], N = [-D[1], D[0]];
  let d = '';
  for (let i = 0; i < TRAJ.length; i += 2) {
    const u = TRAJ[i] / 1000, v = TRAJ[i + 1] / 1000;
    d += (i ? 'L' : 'M') + (E[0] + u * D[0] + v * N[0]).toFixed(1) + ' ' + (E[1] + u * D[1] + v * N[1]).toFixed(1);
  }
  return d;
}

$('#trajTab').setAttribute('d', trajPath([110, 140], [268, 72]));

// handwritten lines: [x] in the dictionary string is a subscript
for (const t of document.querySelectorAll('[data-rich]')) {
  const ns = 'http://www.w3.org/2000/svg', fs = parseFloat(t.getAttribute('font-size')), sh = fs * 0.3;
  let down = false;
  for (const part of _(t.dataset.rich).split(/(\[[^\]]*\])/)) {
    if (!part) continue;
    const sub = part[0] === '[', s = document.createElementNS(ns, 'tspan');
    s.textContent = sub ? part.slice(1, -1) : part;
    if (sub) { s.setAttribute('font-size', (fs * 0.68).toFixed(1)); if (!down) s.setAttribute('dy', sh); down = true; }
    else if (down) { s.setAttribute('dy', -sh); down = false; }
    t.appendChild(s);

// ---------- room drawings (built from the layout) ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  return `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}` +
    `H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
}
const rrb = (b, d = 0) => rr(b[0] - d, b[1] - d, b[2] + 2 * d, b[3] + 2 * d, b[4] + d);
// points about step apart along the rounded rectangle b grown by d
function rrAlong(b, d, step) {
  const x = b[0] - d, y = b[1] - d, w = b[2] + 2 * d, h = b[3] + 2 * d, r = Math.min(b[4] + d, w / 2, h / 2);
  const sw = w - 2 * r, sh = h - 2 * r, q = Math.PI * r / 2, arc = (cx, cy, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  const S = [[sw, t => [x + r + t, y]], [q, t => arc(x + w - r, y + r, -Math.PI / 2 + t / r)], [sh, t => [x + w, y + r + t]],

    [sh, t => [x, y + h - r - t]], [q, t => arc(x + r, y + r, Math.PI + t / r)]];
  const P = S.reduce((a, s) => a + s[0], 0), n = Math.max(4, Math.round(P / step)), out = [];
  for (let i = 0; i < n; i++) {
    let s = (i + 0.5) * P / n, k = 0;

    out.push(S[k][1](s));

  return out;
}

  if (SP.sky) g.drawImage(SP.sky, 0, 0);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sc = SCENES[SP.scene], k = LK === 'land' ? 0 : 1;
  for (const b of sc.bodies) {
    const x = cw / 2 + b.at[k][0] * SP.ww, y = ch / 2 + b.at[k][1] * SP.wh, r = SP.R * b.r;
    const look = globeLook(b.key, r, true, true, 2048, FX, 0);
    if (look && drawGlobe(g, x, y, r, cw, ch, dpr, { rot: b.rot, sun: sc.sun, color: BODIES[b.key].color, look })) continue;
    g.fillStyle = BODIES[b.key].color; g.globalAlpha = 0.5; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill(); g.globalAlpha = 1;
  }
}
const pending = () => { const now = performance.now(); for (const e of TEXC.values()) if (!e.err && (!e.ok || now - e.t < TEX_FADE + 100)) return true; return false; };
function spaceTick() {
  SP.timer = 0;
  if (!SP.sky) { const sk = skyReady(true, false); if (sk) SP.sky = buildSky(sk); }
  compose();
  if (!SP.sky || pending()) SP.timer = setTimeout(spaceTick, 150);
}
function spaceSoon() { if (!SP.timer) SP.timer = setTimeout(spaceTick, 0); }

// ---------- camera ----------
// The world is one transformed layer; a camera is its scale s and the screen point A of the window's centre. Moving to
// the glass slides A linearly and changes s geometrically (as the simulator's camera flights do), and shifts the sky by
// the same A: the camera turns towards the window while the stars stay where they are.
let VW = 0, VH = 0, LK = '', L = null, view = 'desk', CAM = null, ANIM = 0;
const world = $('#world'), spaceWrap = $('#spaceWrap'), goBtn = $('#go');
const wc = () => [L.win[0] + L.win[2] / 2, L.win[1] + L.win[3] / 2];
function deskCam() {
  const [x, y, w, h] = L.safe, s = Math.min(VW / w, VH / h), c = wc();
  return { s, A: [VW / 2 + s * (c[0] - x - w / 2), VH / 2 + s * (c[1] - y - h / 2)] };
}
function winCam() { const g = L.win; return { s: Math.max(VW / (g[2] + 80), VH / (g[3] + 80)), A: [VW / 2, VH / 2] }; }
const LAYERS = [[$('#lWall'), 5], [$('#lDesk'), 11], [$('#lFront'), 24], [$('#lShade'), 11], [$('#lLight'), 11]];
let PAR = [0, 0], PT = [0, 0], PRAF = 0;
function parallax() { for (const [el, amp] of LAYERS) el.style.transform = `translate(${(-PAR[0] * amp / CAM.s).toFixed(2)}px,${(-PAR[1] * amp * 0.5 / CAM.s).toFixed(2)}px)`; }
function apply(c) {
  CAM = c; const k = wc();
  world.style.transform = `translate(${c.A[0] - c.s * k[0]}px,${c.A[1] - c.s * k[1]}px) scale(${c.s})`;
  spaceWrap.style.transform = `translate(${c.A[0] - VW / 2}px,${c.A[1] - VH / 2}px)`;
  parallax();
}
function go(to) {
  if (to === view) return;
  view = to;
  goBtn.textContent = _(to === 'desk' ? 'kab.toWindow' : 'kab.toDesk');
  for (const o of document.querySelectorAll('.obj:not(.deco):not(#o-cat)')) o.inert = to !== 'desk';
  hideTip();
  const from = CAM, dest = to === 'desk' ? deskCam() : winCam();
  cancelAnimationFrame(ANIM); ANIM = 0;
  if (still()) { apply(dest); return; }
  world.style.willChange = 'transform';
  const t0 = performance.now(), T = 1200;
  const step = now => {
    const t = Math.min(1, (now - t0) / T), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    apply({ s: from.s * Math.pow(dest.s / from.s, e), A: [from.A[0] + (dest.A[0] - from.A[0]) * e, from.A[1] + (dest.A[1] - from.A[1]) * e] });
    if (t < 1) ANIM = requestAnimationFrame(step); else { ANIM = 0; world.style.willChange = ''; }
  };
  ANIM = requestAnimationFrame(step);
}

// ---------- the cat ----------
// Sits on the sill with its back to us, watching the window. Every few minutes (or when clicked) it walks to the
// aquarium, taps the glass a few times (the fish dart), and walks back. Still in the low-resource mode and with reduced motion.
const CAT = { el: $('#o-cat'), busy: false, timers: [] };
const catK = () => L.at.cat[2] / 200;
const catX = x => { CAT.el.style.left = x - ANCHOR.cat[0] * catK() + 'px'; };
function catPose(p, face = '') { CAT.el.dataset.pose = p; CAT.el.dataset.face = face; }
function catLater(fn, ms) { CAT.timers.push(setTimeout(fn, ms)); }
function catReset() {
  CAT.timers.forEach(clearTimeout); CAT.timers = []; CAT.busy = false;
  CAT.el.style.transition = ''; catPose('sit'); $('#o-aqua').classList.remove('startle');
  if (L) catX(L.at.cat[0]);
  if (!still()) catLater(catTrip, (150 + Math.random() * 150) * 1000);
}
function catTrip() {
  if (CAT.busy || still()) return;
  CAT.busy = true;
  const home = L.at.cat[0], aq = L.at.aqua, k = catK(), aqK = aq[2] / 200, dest = aq[0] + 86 * aqK + 84 * k; // nose at the glass
  const walk = (x, face, then) => {
    const from = parseFloat(CAT.el.style.left) + ANCHOR.cat[0] * k, dur = Math.abs(x - from) / 110;
    catPose('walk', face);
    CAT.el.style.transition = `left ${dur.toFixed(2)}s linear`;
    requestAnimationFrame(() => catX(x));
    catLater(then, dur * 1000 + 60);
  };
  walk(dest, 'l', () => {
    catPose('paw', 'l'); $('#o-aqua').classList.add('startle');
    catLater(() => {
      $('#o-aqua').classList.remove('startle');
      walk(home, 'r', () => { CAT.timers = []; catReset(); });
    }, 2700);
  });
}

// ---------- layout ----------
const POS = {};
function place(key, at) {
  const el = $('#o-' + key), vb = el.querySelector('svg').viewBox.baseVal, k = at[2] / vb.width, a = ANCHOR[key];
  Object.assign(el.style, { left: at[0] - a[0] * k + 'px', top: at[1] - a[1] * k + 'px', width: at[2] + 'px', height: vb.height * k + 'px' });
  POS[key] = (x, y) => [at[0] + (x - a[0]) * k, at[1] + (y - a[1]) * k]; // that drawing's point in world units
}
function build() {
  Object.assign(world.style, { width: L.W + 'px', height: L.H + 'px' });
  $('#wallBg').innerHTML = wallSvg(L);
  $('#deskBg').innerHTML = deskSvg(L);
  for (const [k, at] of Object.entries(L.at)) place(k, at);
  const g = L.win;
  Object.assign($('#o-glass').style, { left: g[0] + 'px', top: g[1] + 'px', width: g[2] + 'px', height: g[3] + 'px', borderRadius: g[4] + 'px' });
  const bulb = POS.lamp(345, 150), kl = L.at.lamp[2] / 420, pool = [bulb[0] + 60 * kl, (L.desk[0] + L.desk[1]) / 2 + 5, 330 * kl, 120 * kl];
  $('#lShade').innerHTML = shadeSvg(L, pool);
  $('#lLight').innerHTML = lightSvg(L, bulb, pool, POS.aqua(100, 80));
  catReset();
}
function layout() {
  VW = innerWidth; VH = innerHeight;
  const key = VW < VH ? 'port' : 'land';
  if (key !== LK) { LK = key; L = LAYOUTS[key]; build(); }
  const d = deskCam();
  // the sky canvas covers the screen for every camera between the two views, plus the drift
  const M = Math.ceil(Math.max(Math.abs(d.A[0] - VW / 2), Math.abs(d.A[1] - VH / 2)) + 90), dpr = Math.min(devicePixelRatio || 1, 2);
  Object.assign(SP, { cw: VW + 2 * M, ch: VH + 2 * M, dpr, F: Math.max(VW, VH) / 2 / Math.tan(50 * deg), ww: d.s * L.win[2], wh: d.s * L.win[3], sky: null });
  SP.R = Math.min(0.22 * Math.min(SP.ww, SP.wh), 0.4 * SP.ww / 2.3);
  SP.cv.width = Math.round(SP.cw * dpr); SP.cv.height = Math.round(SP.ch * dpr);
  Object.assign(SP.cv.style, { left: -M + 'px', top: -M + 'px', width: SP.cw + 'px', height: SP.ch + 'px' });
  cancelAnimationFrame(ANIM); ANIM = 0; world.style.willChange = '';
  apply(view === 'desk' ? d : winCam());
  clearTimeout(SP.timer); SP.timer = 0; spaceSoon();
}

// ---------- interaction ----------
const tip = $('#tip');
function showTip(el) {
  if (el.inert || ANIM) return;
  tip.textContent = _(el.dataset.tip); tip.hidden = false;
  const r = el.getBoundingClientRect(), w = tip.offsetWidth;
  tip.style.left = Math.min(VW - w / 2 - 8, Math.max(w / 2 + 8, r.left + r.width / 2)) + 'px';
  tip.style.top = Math.max(tip.offsetHeight + 8, r.top - 6) + 'px';
}
function hideTip() { tip.hidden = true; }
for (const o of document.querySelectorAll('.obj:not(.deco)')) {
  o.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') showTip(o); });
  o.addEventListener('pointerleave', hideTip);
  o.addEventListener('focus', () => showTip(o));
  o.addEventListener('blur', hideTip);
}
$('#o-glass').addEventListener('click', () => go('window'));
$('#o-lamp').addEventListener('click', () => $('#cabin').classList.toggle('lamp-off'));
CAT.el.addEventListener('click', () => { hideTip(); catTrip(); });
for (const id of ['clock', 'notebook', 'phones', 'tea']) {
  const o = $('#o-' + id);
  o.addEventListener('click', () => { showTip(o); o.classList.remove('nudge'); void o.offsetWidth; o.classList.add('nudge'); });
}
goBtn.addEventListener('click', () => go(view === 'desk' ? 'window' : 'desk'));
addEventListener('keydown', e => { if (e.key === 'Escape') go('desk'); });
for (const b of document.querySelectorAll('#sceneSeg button')) b.addEventListener('click', () => {
  SP.scene = b.dataset.scene;
  for (const x of document.querySelectorAll('#sceneSeg button')) x.setAttribute('aria-pressed', String(x === b));
  clearTimeout(SP.timer); SP.timer = 0; spaceSoon();
});
for (const b of document.querySelectorAll('#posterSeg button')) b.addEventListener('click', () => {
  $('#o-poster').classList.toggle('own', b.dataset.poster === 'own');
  for (const x of document.querySelectorAll('#posterSeg button')) x.setAttribute('aria-pressed', String(x === b));
});
// parallax: a mouse moves the camera a few pixels; far layers move less (the sky not at all)
addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || still()) return;
  PT = [e.clientX / VW * 2 - 1, e.clientY / VH * 2 - 1];
  if (!PRAF) PRAF = requestAnimationFrame(parStep);
});
function parStep() {
  PRAF = 0;
  PAR = PAR.map((p, i) => p + (PT[i] - p) * 0.1);
  if (!ANIM) parallax();
  if (Math.abs(PAR[0] - PT[0]) + Math.abs(PAR[1] - PT[1]) > 0.002) PRAF = requestAnimationFrame(parStep);
}
let rsz = 0;
addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(layout, 150); });
document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('paused', document.hidden));

layout();
clockTick(); setInterval(clockTick, 5000);
</script>
</body>
